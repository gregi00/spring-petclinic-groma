name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem this feature would solve. Do not include credentials or other sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How can we tell that the feature is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
